name: Build desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Install Raylib
        shell: pwsh
        run: vcpkg install raylib:x64-mingw

      - name: Build Windows executable
        shell: pwsh
        env:
          RAYLIB_PATH: ${{ env.VCPKG_INSTALLATION_ROOT }}\installed\x64-mingw
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast -p dist
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\bin\2mf-raylib.exe release\Layerloom.exe

      - uses: actions/upload-artifact@v4
        with:
          name: layerloom-windows
          path: release/Layerloom.exe

      - name: Attach Windows release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Layerloom.exe

  macos:
    name: macOS disk image
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Install Raylib
        run: brew install raylib

      - name: Build macOS app bundle
        env:
          RAYLIB_PATH: /opt/homebrew/opt/raylib
        run: |
          zig build -Dtarget=aarch64-macos -Doptimize=ReleaseFast -p dist
          mkdir -p "Layerloom.app/Contents/MacOS" "Layerloom.app/Contents/Resources"
          cp dist/bin/2mf-raylib "Layerloom.app/Contents/MacOS/Layerloom"
          cp packaging/macos/Info.plist "Layerloom.app/Contents/Info.plist"
          chmod +x "Layerloom.app/Contents/MacOS/Layerloom"
          codesign --force --deep --sign - "Layerloom.app"
          mkdir -p release
          hdiutil create -volname Layerloom -srcfolder Layerloom.app -ov -format UDZO "release/Layerloom.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: layerloom-macos
          path: release/Layerloom.dmg

      - name: Attach macOS release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Layerloom.dmg
